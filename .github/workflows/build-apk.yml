name: Build LSDER DERIV V36 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          zipfile=$(find . -maxdepth 1 -type f -name 'LSDER_DERIV_V36_PROJECT_UPDATED*.zip' -print -quit)
          test -n "$zipfile" || { echo 'Project ZIP not found at repository root'; exit 1; }
          unzip -q "$zipfile" -d extracted
          test -f extracted/LSDER_DERIV_V36/settings.gradle.kts
      - name: Build APK
        working-directory: extracted/LSDER_DERIV_V36
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LSDER-DERIV-V36-debug-APK
          path: extracted/LSDER_DERIV_V36/app/build/outputs/apk/debug/app-debug.apk
